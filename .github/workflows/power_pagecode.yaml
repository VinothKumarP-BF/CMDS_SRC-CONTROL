name: Download Power Pages from DEV

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PAC_CLI_VERSION: "2.9.3"
  SOURCE_BRANCH: Power_PageCode

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Checkout YAML Branch
        uses: actions/checkout@v4
        with:
          ref: yaml
          path: yaml-config

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PAC CLI
        shell: bash
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $PAC_CLI_VERSION
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate Test
        shell: bash
        run: |
          pac auth create \
            --url "${{ secrets.POC_DEV_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Download Power Pages
        shell: bash
        run: |
          pac pages download \
            --path "." \
            --webSiteId "${{ secrets.POWERPAGES_WEBSITE_ID }}"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Download Power Pages from DEV"
            git push origin HEAD:${SOURCE_BRANCH}
          else
            echo "No changes detected"
          fi
