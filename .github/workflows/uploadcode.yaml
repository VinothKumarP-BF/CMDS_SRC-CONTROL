name: Upload Power Pages to DEV

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PAC_CLI_VERSION: "2.9.3"
  SOURCE_BRANCH: Power_PageCode

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PAC CLI
        shell: bash
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $PAC_CLI_VERSION
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate Test
        shell: bash
        run: |
          pac auth create \
            --url "${{ secrets.POC_DEV_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Upload Power Pages to DEV
        shell: bash
        run: |
          pac pages upload \
            --path "./cmds-next-gen-provider-barreldev \
            --environment "$ENVIRONMENT_URL"
