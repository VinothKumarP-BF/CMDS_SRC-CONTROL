<div class="cmdspp-audit-section">
  <div class="cmdspp-audit-search">
    <div class="cmdspp-search-input-wrapper">
      <img src="/cmdspp_searchIcon" alt="Search" class="cmdspp-search-icon-img" />
      <input 
        type="text" 
        id="cmdspp-search-modified-by" 
        placeholder="Search by Operation Type, Modified By, Date(MM/DD/YYYY), or Changed Fields" 
        class="cmdspp-search-input" 
      />
    </div>
  </div>

  <!-- Common Table Web Template Inclusion -->
  {% include 'cmdspp_CommonTable' %}
  {% include 'cmdspp_Loader' %}
  {% include 'cmdspp_ToastModal' %}

<div class="row sectionBlockLayout text-start" style="display: none; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;">
    <div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;"></div>
  </div>
</div>
