<div class="modal fade" id="commonConfirmationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Confirmation</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="modalMessage">
            </div>

            <div class="modal-footer">
                <button type="button"
                        class="CancelButton"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <button type="button"
                        class="submitButton"
                        id="modalConfirmBtn">
                    Confirm
                </button>
            </div>
        </div>
    </div>
</div>


<script>
    let modalCallback = null;

function showConfirmationModal(title, message, callback) {

    $("#modalTitle").text(title);
    $("#modalMessage").text(message);

    modalCallback = callback;

    $("#commonConfirmationModal").modal("show");
}

$("#modalConfirmBtn").on("click", function () {

    if (typeof modalCallback === "function") {
        modalCallback();
    }

    $("#commonConfirmationModal").modal("hide");
});

</script>

<style>
    #commonConfirmationModal .modal-header{
        border:none;
    }
    #commonConfirmationModal .CancelButton{
        width: 224px;
        height: 38px;
        border-radius: 10px;
        padding-top: 8px;
        padding-right: 20px;
        padding-bottom: 8px;
        padding-left: 20px;
        angle: 0 deg;
        opacity: 1;
        border-width: 1px;
        opacity: 1;
        color: #0B3A6F;
        border: 1px solid #0B3A6F;
        margin: 0px;
    }
     #commonConfirmationModal .submitButton{
        width: 224px;
        height: 38px;
        color: #FFFFFF;
        border-radius: 10px;
        padding-top: 8px;
        padding-right: 20px;
        padding-bottom: 8px;
        padding-left: 20px;
        angle: 0 deg;
        opacity: 1;
        font-weight: 400;
        font-size: 14px;
        line-height: 20px;
        letter-spacing: 0px;
        text-align: center;
        background: #274463;
        margin: 0px;
     }
      

     
    </style>
