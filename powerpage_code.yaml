name: Download Power Pages from DEV
on:
  workflow_dispatch:
permissions:
  contents: write
  
env:
  PAC_CLI_VERSION: "2.9.3"
  SOURCE_BRANCH: Power_PageCode

jobs:
  download:
    runs-on: windows-latest

    steps:
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Checkout YAML Branch
        uses: actions/checkout@v4
        with:
          ref: yaml
          path: yaml-config

      - name: Install PAC CLI
        shell: powershell
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $env:PAC_CLI_VERSION
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Authenticate Test
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac auth create \
            --url "${{ secrets.TEST_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"      
            
      - name: Download Power Pages
        run: |
          pac pages download \
            --path "." \
            --webSiteId "${{ secrets.POWERPAGES_WEBSITE_ID }}" \
            --environment "${{ secrets.POWERPLATFORM_DEV_URL }}"
            
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (
            git commit -m "Download Power Pages from DEV" &&
            git push origin powerpages-dev-sync
          )
 
